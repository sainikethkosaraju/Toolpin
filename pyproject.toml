[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolpin"
version = "0.2.0"
description = "Pin every MCP tool by hash and gate every call: lockfile, default-deny policy, call-bound approvals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6,<7", "mcp>=2,<3", "cryptography>=42"]

[project.optional-dependencies]
cedar = ["cedarpy>=4,<5"]
stack = ["ontolite"]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "hypothesis>=6", "ruff>=0.6", "pyright>=1.1.380", "cedarpy>=4,<5"]

[project.scripts]
toolpin = "toolpin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolpin"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701", "E702", "E501", "B905", "E731", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
reportMissingModuleSource = false
reportMissingImports = false
